name: Timetable sync

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/timetable-sync/requirements.txt
      - name: Parser smoke test
        run: python backend/timetable-sync/sync.py --dry-run
      - name: Fetch Caremar/SNAV and update feed
        run: python backend/timetable-sync/sync.py --write api/routes.json --also-bundle
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/routes.json "Capri Transport/Schedule/routes.json"
          if git diff --staged --quiet; then
            echo "No timetable changes."
          else
            git commit -m "chore: sync Caremar/SNAV timetable feed"
            git push
            if [ -n "${{ secrets.GITHUB_MIRROR_PUSH_URL }}" ]; then
              git push "${{ secrets.GITHUB_MIRROR_PUSH_URL }}" HEAD:main
            fi
          fi
