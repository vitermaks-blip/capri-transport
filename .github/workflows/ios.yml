name: iOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timetable-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/timetable-sync/requirements.txt
      - name: Caremar/SNAV parser smoke test
        run: python backend/timetable-sync/sync.py --dry-run

  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Detect project format
        id: project
        run: |
          if [ -f "Capri Transport.xcodeproj/project.xcproj" ] && [ ! -f "Capri Transport.xcodeproj/project.pbxproj" ]; then
            echo "xcproj_only=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Note (Xcode 27 project on CI)
        if: steps.project.outputs.xcproj_only == 'true'
        run: |
          echo "::notice::This repo uses project.xcproj (Xcode 27+). GitHub macos-15 runners expect project.pbxproj."
          echo "Build & test on your Mac (Xcode 27) before TestFlight — see docs/TESTFLIGHT.md"
      - name: Select Xcode
        if: steps.project.outputs.xcproj_only != 'true'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build
        if: steps.project.outputs.xcproj_only != 'true'
        run: |
          xcodebuild -scheme "Capri Transport" \
            -destination 'generic/platform=iOS Simulator' \
            -quiet build
      - name: Resolve iOS Simulator
        if: steps.project.outputs.xcproj_only != 'true'
        id: sim
        run: |
          for model in "iPhone 16" "iPhone 17" "iPhone 15"; do
            if xcrun simctl list devices available | grep -qF "$model"; then
              echo "name=$model" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          name="$(xcrun simctl list devices available | awk -F'[()]' '/iPhone [0-9]/ {gsub(/^ +| +$/, "", $1); print $1; exit}')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Test
        if: steps.project.outputs.xcproj_only != 'true'
        run: |
          xcodebuild -scheme "Capri Transport" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -quiet test
